<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Underhållspaus – Glosor</title>
<link rel="icon" href="data:,">
<style>
/* Fristående: sidan använder ingen annan fil, så den fungerar även medan style.css och script.js byts ut */
:root{
  color-scheme:light dark;
  --paper:#f4f7fb; --sheet:#fff; --ink:#14213d; --mute:#5b6b88;
  --rule:#d5e0ef; --margin:#e5484d; --mark:#ffd23f;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0e1522; --sheet:#152033; --ink:#e6edf7; --mute:#8896b0; --rule:#24324b; --margin:#f0686c}
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;
  background:var(--paper);color:var(--ink);font:16px/32px system-ui,-apple-system,"Segoe UI",sans-serif;
}
.note{
  width:100%;max-width:520px;padding:32px 1.5rem 32px 2.25rem;
  background:linear-gradient(to bottom,transparent 31px,var(--rule) 31px) 0 0/100% 32px,var(--sheet);
  border:1px solid var(--rule);border-left:3px solid var(--margin);border-radius:6px;
}
h1{margin:0;font-size:2rem;line-height:64px;letter-spacing:-.02em}
mark{padding:.05em .25em;color:#14213d;background:var(--mark)}
p{margin:0}
.en{color:var(--mute);font-size:.9rem}
button{
  margin-top:32px;padding:.6rem 1.1rem;font:inherit;font-weight:600;line-height:1.5;
  color:#14213d;background:var(--mark);border:1px solid var(--mark);border-radius:6px;cursor:pointer;
}
button:hover{filter:brightness(.95)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#status{min-height:32px;color:var(--mute);font-size:.9rem}
</style>
</head>
<body>
<main class="note">
  <h1><mark>Underhållspaus</mark></h1>
  <p class="en">Maintenance break</p>
  <p>Tack för att du använder Glosor! Vi uppdaterar sidan just nu och är snart tillbaka.</p>
  <p class="en">Thanks for using the site. We'll be back shortly.</p>
  <button id="retry" type="button">Försök igen</button>
  <p id="status" role="status"></p>
</main>
<script>
// Sidan kollar själv om underhållet är slut och skickar då besökaren tillbaka till appen.
(function () {
  var KOLLA = 30000;                       // hur ofta (ms) sidan kollar
  var btn = document.getElementById('retry'), status = document.getElementById('status');
  function kolla(visa) {
    if (visa === true) status.textContent = 'Kollar…';
    fetch('underhall.js', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var m = /^\s*var\s+UNDERHALL\s*=\s*(true|false)/m.exec(t);
        if (m && m[1] === 'false') location.replace('index.html');
        else if (visa === true) status.textContent = 'Sidan uppdateras fortfarande. Försök igen om en stund.';
      })
      .catch(function () { if (visa === true) status.textContent = 'Kunde inte kolla just nu. Försök igen om en stund.'; });
  }
  btn.addEventListener('click', function () { kolla(true); });
  setInterval(kolla, KOLLA);
})();
</script>
</body>
</html>
